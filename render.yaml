services:
  - type: web
    name: brand-ai-readiness-audit
    runtime: python
    buildCommand: pip install -r brand-ai-readiness-audit/requirements.txt
    startCommand: cd brand-ai-readiness-audit && gunicorn app:app --bind 0.0.0:$PORT --workers 1 --timeout 300
    healthCheckPath: /health
    autoDeploy: true
    disk:
      name: audit-reports
      mountPath: /opt/render/project/src/brand-ai-readiness-audit/audit-output
      sizeGB: 1
    envVars:
      - key: SECRET_KEY
        sync: false
      - key: MONGO_URI
        sync: false
      - key: MONGO_DB
        value: brand_audit
